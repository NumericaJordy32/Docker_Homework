name: Publish images to ACR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Sign in to ACR
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - name: Build and push all services
        run: |
          tag="${GITHUB_SHA::7}"
          for service in oauth-jwt-api pacientes-api historial-clinico-api api-gateway; do
            case "$service" in
              oauth-jwt-api) context=OAuthJWT.Api ;;
              pacientes-api) context=Pacientes.Api ;;
              historial-clinico-api) context=HistorialClinico.Api ;;
              api-gateway) context=ApiGateway ;;
            esac
            docker buildx build --push \
              --tag "$ACR_LOGIN_SERVER/clinica/$service:$tag" \
              --tag "$ACR_LOGIN_SERVER/clinica/$service:latest" \
              "$context"
          done
